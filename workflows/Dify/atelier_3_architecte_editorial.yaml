            Identifie les thèmes, sous-thèmes, objectifs, tensions, exemples, arguments
            et transitions possibles. Distingue le contenu central, les éléments secondaires
            et les digressions. Propose des unités éditoriales E01, E02… avec idée
            directrice, éléments de source, liens avec les arguments et anomalies
            de l’audit (identifiants existants uniquement), termes du glossaire pertinents
            et limites. Repère les passages dont l''omission pourrait déformer le
            sens. Si le glossaire est vide, indique-le. Restitue une cartographie
            Markdown, sans plan définitif.'
