app:
  description: "Atelier 1 - Identification des intervenants, normalisation et glossaire technique."
  icon: 🤖
  icon_background: "#FFEAD5"
  mode: workflow
  name: "Atelier 1 : Profileur & Indexeur"
kind: app
version: 0.1.2
workflow:
  features:
    file_upload:
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - remote_url
        - local_file
    opening_statement: ""
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
    - data:
        sourceType: start
        targetType: llm
      id: start-profileur
      source: "1710000000000"
      target: "profileur_llm"
    - data:
        sourceType: llm
        targetType: code
      id: profileur-code
      source: "profileur_llm"
      target: "normalizer_code"
    - data:
        sourceType: code
        targetType: llm
      id: code-glossaire
      source: "normalizer_code"
      target: "glossaire_llm"
    - data:
        sourceType: llm
        targetType: end
      id: glossaire-end
      source: "glossaire_llm"
      target: "1710000000002"
    nodes:
    - data:
        desc: ""
        selected: false
        title: Début
        type: start
        variables:
        - label: Texte d'entrée (Transcription/Brut)
          max_length: 100000
          options: []
          required: true
          type: paragraph
          variable: input_text
      id: "1710000000000"
      position:
        x: 80
        y: 280
      type: start
    - data:
        context:
          enabled: false
          variable_selector: []
        model:
          completion_params:
            temperature: 0.2
          mode: chat
          name: gemini-1.5-flash
          provider: google
        prompt_template:
        - id: system
          role: system
          text: "Tu es un agent expert en analyse de discours et profilage. Ton rôle est d'identifier les intervenants dans une transcription.\n\nCONSIGNES :\n1. Analyse le début de la transcription fournie.\n2. Repère les indices (salutations, présentations, contextes) pour identifier qui se cache derrière SPEAKER_00, SPEAKER_01, etc.\n3. Réponds EXCLUSIVEMENT sous forme d'un objet JSON valide.\n\nFORMAT DE RÉPONSE :\n{\"SPEAKER_00\": \"Nom ou Rôle\", \"SPEAKER_01\": \"Nom ou Rôle\"}\n\nSi tu ne peux pas identifier un nom, utilise un rôle descriptif (ex: \"Intervieweur\", \"Expert\")."
        - id: user
          role: user
          text: "Voici le début de la transcription :\n\n{{input_text|slice(0, 5000)}}"
        selected: false
        title: Profileur (Stratégie A)
        type: llm
        variables: []
      id: profileur_llm
      position:
        x: 320
        y: 280
      type: llm
    - data:
        code: |
          import json
          import re

          def main(input_text: str, speaker_map_str: str):
              try:
                  # Nettoyage de la chaîne JSON si nécessaire
                  map_match = re.search(r'\{.*\}', speaker_map_str, re.DOTALL)
                  if map_match:
                      mapping = json.loads(map_match.group())
                  else:
                      mapping = {}
              except:
                  mapping = {}
              
              normalized_text = input_text
              for speaker_id, real_name in mapping.items():
                  normalized_text = normalized_text.replace(speaker_id, real_name)
              
              return {
                  "normalized_text": normalized_text,
                  "mapping": mapping
              }
        code_language: python3
        outputs:
          mapping:
            type: object
          normalized_text:
            type: string
        selected: false
        title: Normalisation du Texte
        type: code
        variables:
        - value_selector:
          - "1710000000000"
          - input_text
          variable: input_text
        - value_selector:
          - profileur_llm
          - text
          variable: speaker_map_str
      id: normalizer_code
      position:
        x: 560
        y: 280
      type: code
    - data:
        context:
          enabled: false
          variable_selector: []
        model:
          completion_params:
            temperature: 0.3
          mode: chat
          name: gemini-1.5-flash
          provider: google
        prompt_template:
        - id: system
          role: system
          text: "Tu es un terminologue expert. Ta mission est de créer un glossaire à partir du texte fourni.\n\nCONSIGNES :\n1. Identifie les termes techniques, acronymes ou concepts clés.\n2. Pour chaque terme, propose une définition concise basée sur le contexte du texte.\n3. Présente le résultat sous forme de tableau Markdown : | Terme | Définition contextuelle |.\n\nREMARQUE : Sois sélectif, ne retiens que les termes qui ont une valeur métier ou conceptuelle forte."
        - id: user
          role: user
          text: "Voici le texte à analyser :\n\n{{normalizer_code.normalized_text}}"
        selected: false
        title: Générateur de Glossaire
        type: llm
        variables: []
      id: glossaire_llm
      position:
        x: 800
        y: 280
      type: llm
    - data:
        outputs:
        - value_selector:
          - normalizer_code
          - normalized_text
          variable: texte_final
        - value_selector:
          - normalizer_code
          - mapping
          variable: identites_locuteurs
        - value_selector:
          - glossaire_llm
          - text
          variable: glossaire_markdown
        selected: false
        title: Fin
        type: end
      id: "1710000000002"
      position:
        x: 1040
        y: 280
      type: end
