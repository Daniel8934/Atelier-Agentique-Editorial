        - id: system
          role: system
          text: 'Tu es un agent expert en analyse de discours et profilage. Ton rôle
            est d''identifier les intervenants dans une transcription.


            CONSIGNES :

            1. Analyse le début de la transcription fournie.

            2. Repère les indices (salutations, présentations, contextes) pour identifier
            qui se cache derrière SPEAKER_00, SPEAKER_01, etc.

            3. Réponds EXCLUSIVEMENT sous forme d''un objet JSON valide.


            FORMAT DE RÉPONSE :

            {"SPEAKER_00": "Nom ou Rôle", "SPEAKER_01": "Nom ou Rôle"}


            Si tu ne peux pas identifier un nom, utilise un rôle descriptif (ex: "Intervieweur",
            "Expert").'
        - id: user
          role: user
          text: 'Voici la transcription (concentre ton analyse sur ses 5000 premiers
            caractères) :


            {{#1710000000000.input_text#}}'
        selected: false
        title: Profileur (Stratégie A)
        type: llm
        variables: []
        vision:
          enabled: false
      height: 88
      id: profileur_llm
      position:
