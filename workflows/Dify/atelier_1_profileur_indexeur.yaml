    - data:
        code: "import json\nimport re\n\ndef main(input_text: str, speaker_map_str:\
          \ str):\n    try:\n        # Nettoyage de la chaîne JSON si nécessaire\n\
          \        map_match = re.search(r'\\{.*\\}', speaker_map_str, re.DOTALL)\n\
          \        if map_match:\n            mapping = json.loads(map_match.group())\n\
          \        else:\n            mapping = {}\n    except:\n        mapping =\
          \ {}\n    \n    normalized_text = input_text\n    for speaker_id, real_name\
          \ in mapping.items():\n        normalized_text = normalized_text.replace(speaker_id,\
          \ real_name)\n    \n    return {\n        \"normalized_text\": normalized_text,\n\
          \        \"mapping\": mapping\n    }\n"
        code_language: python3
        desc: ''
        outputs:
          mapping:
            type: object
          normalized_text:
            type: string
        selected: false
        title: Normalisation du Texte
        type: code
        variables:
